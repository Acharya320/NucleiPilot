id: demo-admin-indicator

info:
  name: Toy App - Management Surface Indicator
  author: nucleipilot
  severity: info
  description: |
    Synthetic INDICATOR (weak signal) that a management/admin surface may exist
    on the toy sandbox app. A match here is NOT proof of a vulnerability; it only
    suggests that a follow-up validation is warranted. Localhost sandbox only.
  tags: nucleipilot,toy,admin,indicator

http:
  - method: GET
    path:
      - "{{BaseURL}}/metadata"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: and
        words:
          - "management_surface"
          - "present"
