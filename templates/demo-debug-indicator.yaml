id: demo-debug-indicator

info:
  name: Toy App - Debug Mode Indicator
  author: nucleipilot
  severity: info
  description: |
    Synthetic INDICATOR that debug mode may be enabled. Weak signal only. The
    `benign` sandbox profile deliberately shows this indicator WITHOUT any real
    exposure, to test false-positive handling. Localhost sandbox only.
  tags: nucleipilot,toy,debug,indicator

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/config"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: and
        words:
          - "debug"
          - "synthetic_indicator"
