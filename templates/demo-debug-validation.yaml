id: demo-debug-validation

info:
  name: Toy App - Debug Interface Exposed (Validation)
  author: nucleipilot
  severity: high
  description: |
    Synthetic VALIDATION that a debug interface is actually exposed (the toy app
    returns a synthetic debug token). This confirms the debug finding that the
    indicator only hinted at. Synthetic; localhost sandbox only.
  tags: nucleipilot,toy,debug,validation

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/confirm"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: and
        words:
          - "debug_exposure"
          - "confirmed"
